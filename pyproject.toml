[project]
name = "evorag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yusuf Öztoprak", email = "yusufoztoprak35@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "openai>=3.19.2",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.0",
    "tiktoken>=0.14.0",
    "vector>=1.9.0",
]

[project.scripts]
evorag = "evorag:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]
